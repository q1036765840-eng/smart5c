server:
  tomcat:
    connection-timeout: 600000
    keep-alive-timeout: 300000
    max-connections: 10000
    threads:
      max: 200
      min-spare: 10
    max-http-header-size: 8192
    max-http-post-size: 10485760
  port: 5160
spring:
  datasource:
    #          url: jdbc:mysql://localhost:3306/intelligent_c2?createDatabaseIfNotExist=true&autoReconnect=true&useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    #    url: jdbc:mysql://192.168.5.242:3306/smart_city?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    url: jdbc:mysql://192.168.5.99:3306/nbk_smart_5c?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai
    #    url:  jdbc:mysql://localhost:3306/intelligent_c2?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: root
    password: ENC(L5RE3/q9OZddKsLE640ADm09jxBliZlUG5+fkSTax6j/8HCAF5bIF0dSwyV1JEqr)
#    password: ENC(Qg6+cU0iNFf9WPTmX2UknXnRg/afFJMJTiAtW6hkUOykyv6hqtN1TaOdPuRNjKDh)
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 设置是否自动提交事务，默认为true
      auto-commit: true
      # 设置用于测试连接的SQL查询语句
      connection-test-query: SELECT 1
      # 设置获取数据库连接的超时时间，默认为30秒，单位是秒
      connection-timeout: 600000
      # 设置连接在连接池中保持空闲的最长时间，默认为10分钟，单位是秒
      idle-timeout: 600000
      # 设置连接在连接池中泄漏检测阈值的最长时间，默认为10分钟，单位是秒
      leak-detection-threshold: 60000
      # 设置连接在连接池中允许存在的最长时间，默认为30分钟，单位是秒
      max-lifetime: 1800000
      # 设置连接池中允许的最大连接数，默认为10
      maximum-pool-size: 50
      # 设置连接池中保持的最小空闲连接数，默认为10
      minimum-idle: 5
      # 设置连接池的名称，默认为"HikariPool-1"
      pool-name: agriculture
      # 设置连接验证的超时时间，默认为5秒，单位是秒
      validation-timeout: 300

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml # Mapper XML 文件的位置
  type-aliases-package: com.nbk.smart5c.entity # 别名包扫描路径，设置实体类所在的包
  global-config:
    db-config:
      id-type: auto # ID生成策略
      table-prefix: nbk_ # 表前缀
      field-strategy: not_empty # 字段策略
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
  configuration:
    map-underscore-to-camel-case: true # 开启驼峰命名规则自动映射
    #    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL语句到控制台
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl # 不打印SQL语句到控制台

# MyBatis-Plus 日志配置，这里使用了STDOUT_LOGGING实现，你可以根据需要更换为LOG4J等
logging:
  level:
    com.baomidou.mybatisplus: error # MyBatis-Plus日志级别jwt:
jwt:
  tokenHeader: Authorization #JWT存储的请求头
  secret: smart5c-admin-secret #JWT加解密使用的密钥
  expiration: 604800 #JWT的超期限时间(60*60*24)
  tokenHead: Bearer  #JWT负载中拿到开头