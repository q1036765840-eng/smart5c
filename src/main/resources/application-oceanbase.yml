ai:
  ip: 127.0.0.1
  port: 5000
  line_location_category: a #线路定位类别
# 是否启用文件5c文件同步功能
# 该功能将做以下操作：
# 1. 从 mqtt 读取原始的 5c 文件基本信息，并将基本信息保存到 info.xml 文件中
# 2. 从 minio 中下载相应的拍摄图片，图片地址来源于第1步的基本信息
# 3. 调用 InspectionDataServiceImpl#parseData 方法，对刚刚下载的5C文件进行分
file-sync:
  # 生产语义的匿名同步面，dev 环境默认关闭（配合 access-token 使用，见 C5RawFileSyncAuth）
  enable: true
  access-token: __C5_OUTACCESS_5C__
  host: http://192.168.0.25:15160/anon/task/list?pat=
# 5C 智能分析数据同步：生产环境开启各段 MQTT 订阅（账号见 application.yml 的 mqtt.segments）
mqtt:
  enabled: true
